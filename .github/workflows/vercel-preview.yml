name: Vercel Preview

on:
  pull_request:
    branches: [main]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_NLqxMYlyigEALnsx1i7KwugU
      VERCEL_PROJECT_ID: prj_up14kacr4T4AGsjOwCtjpi7TqDLK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Pull Vercel Environment Information
        run: npx --yes vercel@62.1.0 pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        run: npx --yes vercel@62.1.0 deploy --yes --no-color --token=${{ secrets.VERCEL_TOKEN }}
